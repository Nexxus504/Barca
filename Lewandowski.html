    font-family: system-ui;

  .regresar{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #001f3f;
    z-index: 10;
    padding: 10px;
  }
  
  .regresar a{
    color: #ffc72c;
    text-decoration: none;
  }
  .fondo{
    position:relative;
  }
  .descargar{
    position: absolute;
    bottom: 8px;
    right:8px;
    background: rgba(0,0,0,0.7);
    color: #ffc72c;
    border:none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display:flex;
    align-items: center;
    justify-content:center;
    cursor:pointer;
    z-index: 5;
  }
  
  .material-symbols-outlined {
    font-size:28px;
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}

  .imagenes{
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 columnas en cel */
    padding: 15px;
    gap: 12px;
  }
  
  .fondo img{
    width: 100%;
    height: 200px; 
    object-fit: cover;
    border-radius: 15px;
    border: 2px solid #a50044;
    cursor: pointer;
    display: block;
  }

 
  @media (min-width: 768px) {
    .imagenes{
      grid-template-columns: repeat(4, 1fr);
    }
  }
  #toast{
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white; 
  padding: 12px 20px;
  border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
  font-size: 18px;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 9999;
}
#toast.mostrar{
  opacity: 1;
}
  </style>

  <script>
function descargar(ruta) {
  
  const toast = document.getElementById('toast');
  toast.classList.add('mostrar');

 
  const a = document.createElement('a');
  a.href = ruta;
  a.download = ruta.split('/').pop();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

 
  setTimeout(() => {
    toast.classList.remove('mostrar');
  }, 3000);
}
</script>
